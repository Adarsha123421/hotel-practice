<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grand Hotel</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  color: #222;
}

nav {
  padding: 20px;
  background: #172b25;
  color: white;
  font-size: 22px;
}

.hero {
  height: 450px;
  background:
  linear-gradient(#0005,#0005),
  url('room1.jpg') center/cover;

  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
}

.hero h1 {
  font-size: 42px;
}

.hero p {
  margin-top: 15px;
}

section {
  padding: 50px 20px;
  text-align: center;
}

.gallery img {
  width: 100%;
  max-width: 350px;
  height: 230px;
  object-fit: cover;
  margin: 10px;
  border-radius: 10px;
}

footer {
  background: #172b25;
  color: white;
  padding: 25px;
  text-align: center;
}

</style>
</head>

<body>

<nav>
Grand Hotel
</nav>

<div class="hero">
  <div>
    <h1>Welcome to Grand Hotel</h1>
    <p>Experience comfort and luxury</p>
  </div>
</div>

<section>
  <h2>About Us</h2>
  <p>Enjoy a comfortable stay with us.</p>
</section>

<section class="gallery">
  <h2>Our Rooms</h2>
  <br>
  <img src="room1.jpg" alt="Hotel room">
</section>

<footer>
  Contact Us | Grand Hotel
</footer>

</body>
</html>
